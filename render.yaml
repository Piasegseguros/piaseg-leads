databases:
  - name: piaseg-leads-db
    plan: free

services:
  - type: web
    name: piaseg-leads-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    filter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: piaseg-leads-db
          property: connectionString
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
